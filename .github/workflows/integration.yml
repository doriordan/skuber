name: Integration Tests

on:
  push:
    branches:
      - '3.2.x'
      - 'master'
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - '3.2.x'
      - 'master'
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      scala-version:
        description: 'Scala version to test'
        required: false
        default: '3.3.7'
        type: choice
        options:
          - '2.13.18'
          - '3.3.7'

jobs:
  detect-changes:
    name: Detect Changed Sub-projects
    runs-on: ubuntu-latest
    outputs:
      run-integration: ${{ steps.changes.outputs.run-integration }}
      run-cats-it: ${{ steps.changes.outputs.run-cats-it }}
      run-zio-it: ${{ steps.changes.outputs.run-zio-it }}
      any-integration: ${{ steps.changes.outputs.any-integration }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          # For pushes to main branches, workflow_dispatch, or force-label: run all
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run-integration=true" >> $GITHUB_OUTPUT
            echo "run-cats-it=true" >> $GITHUB_OUTPUT
            echo "run-zio-it=true" >> $GITHUB_OUTPUT
            echo "any-integration=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If PR has 'run-integration-tests' label, run all
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'run-integration-tests') }}" == "true" ]]; then
            echo "run-integration=true" >> $GITHUB_OUTPUT
            echo "run-cats-it=true" >> $GITHUB_OUTPUT
            echo "run-zio-it=true" >> $GITHUB_OUTPUT
            echo "any-integration=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          RUN_INTEGRATION=false
          RUN_CATS_IT=false
          RUN_ZIO_IT=false

          # core changes trigger all integration tests
          if echo "$CHANGED" | grep -qE '^core/'; then
            RUN_INTEGRATION=true
            RUN_CATS_IT=true
            RUN_ZIO_IT=true
          fi

          # akka or pekko changes trigger Akka/Pekko integration tests
          if echo "$CHANGED" | grep -qE '^(akka|pekko)/'; then
            RUN_INTEGRATION=true
          fi

          # cats changes trigger cats-it tests
          if echo "$CHANGED" | grep -qE '^cats/'; then
            RUN_CATS_IT=true
          fi

          # zio changes trigger zio-it tests
          if echo "$CHANGED" | grep -qE '^zio/'; then
            RUN_ZIO_IT=true
          fi

          # integration test source changes trigger their own tests
          if echo "$CHANGED" | grep -qE '^integration/'; then
            RUN_INTEGRATION=true
          fi
          if echo "$CHANGED" | grep -qE '^cats-it/'; then
            RUN_CATS_IT=true
          fi
          if echo "$CHANGED" | grep -qE '^zio-it/'; then
            RUN_ZIO_IT=true
          fi

          # Shared build config changes trigger all tests
          if echo "$CHANGED" | grep -qE '^(build\.sbt|project/)'; then
            RUN_INTEGRATION=true
            RUN_CATS_IT=true
            RUN_ZIO_IT=true
          fi

          echo "run-integration=$RUN_INTEGRATION" >> $GITHUB_OUTPUT
          echo "run-cats-it=$RUN_CATS_IT" >> $GITHUB_OUTPUT
          echo "run-zio-it=$RUN_ZIO_IT" >> $GITHUB_OUTPUT

          if [[ "$RUN_INTEGRATION" == "true" || "$RUN_CATS_IT" == "true" || "$RUN_ZIO_IT" == "true" ]]; then
            echo "any-integration=true" >> $GITHUB_OUTPUT
          else
            echo "any-integration=false" >> $GITHUB_OUTPUT
          fi

  integration-tests:
    name: Integration Tests (Scala ${{ matrix.scala }})
    needs: detect-changes
    if: needs.detect-changes.outputs.any-integration == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scala: ['3.3.8']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Setup Scala
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-integration-${{ matrix.scala }}-${{ hashFiles('**/build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-integration-${{ matrix.scala }}-
            ${{ runner.os }}-sbt-integration-
            ${{ runner.os }}-sbt-

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: skuber-test
          wait: 120s

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      - name: Set KUBECONFIG environment
        run: |
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          kubectl config view

      - name: Compile modules
        run: sbt ++${{ matrix.scala }} compile

      - name: Run integration tests (Akka/Pekko)
        if: needs.detect-changes.outputs.run-integration == 'true'
        run: sbt ++${{ matrix.scala }} integration/test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        timeout-minutes: 30

      - name: Run cats integration tests
        if: needs.detect-changes.outputs.run-cats-it == 'true'
        run: sbt ++${{ matrix.scala }} cats-it/test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        timeout-minutes: 30

      - name: Run zio integration tests
        if: needs.detect-changes.outputs.run-zio-it == 'true'
        run: sbt ++${{ matrix.scala }} zio-it/test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        timeout-minutes: 30

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Kubernetes Cluster Status ==="
          kubectl get all --all-namespaces
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces --sort-by='.lastTimestamp'
          echo "=== Kind Cluster Logs ==="
          kind export logs /tmp/kind-logs || true

      - name: Upload kind logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs-scala-${{ matrix.scala }}
          path: /tmp/kind-logs
          retention-days: 5
