name: CI

on:
  push:
    branches:
      - '3.2.x'
      - '2.6.x'
      - 'master'
      - 'githubactions'
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - '3.2.x'
      - '2.6.x'
      - 'master'
    paths-ignore:
      - 'docs/**'
jobs:
  build-and-test:
    name: Build and Test (Scala ${{ matrix.scala }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scala: ['2.13.18', '3.3.8']
        java: ['17']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for any git-based versioning

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      - name: Setup Scala
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:${{ matrix.java }}
          apps: sbt

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ matrix.scala }}-${{ hashFiles('**/build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-${{ matrix.scala }}-
            ${{ runner.os }}-sbt-

      - name: Compile all modules
        run: sbt ++${{ matrix.scala }} compile

      - name: Run core module unit tests
        run: sbt ++${{ matrix.scala }} core/test

      - name: Run Pekko module unit tests
        run: sbt ++${{ matrix.scala }} pekko/test

      - name: Run Akka module unit tests
        run: sbt ++${{ matrix.scala }} akka/test

      - name: Run Cats module unit tests
        run: sbt ++${{ matrix.scala }} cats/test
        if: matrix.scala == '3.3.8'

      - name: Build examples
        run: sbt ++${{ matrix.scala }} examples/compile
        if: matrix.scala == '3.3.8'
